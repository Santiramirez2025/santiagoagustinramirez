<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No se pudo procesar el pago — Santiago Ramírez</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ECE7DA">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{--paper:#ECE7DA;--ink:#17140E;--muted:#6E685A;--line:rgba(23,20,14,.14);--forest:#163A2B;--red:#B42318;--on-forest:#E9E4D6;--serif:"Instrument Serif",Georgia,serif;--sans:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px;line-height:1.5}
  .card{max-width:520px;width:100%;text-align:center}
  .x{width:64px;height:64px;border-radius:50%;background:var(--red);display:grid;place-items:center;margin:0 auto 24px}
  .x svg{stroke:#fff}
  h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,7vw,42px);line-height:1.05;margin-bottom:12px}
  p{color:var(--muted);font-size:16px;margin-bottom:20px}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--forest);color:var(--on-forest);text-decoration:none;padding:14px 24px;border-radius:999px;font-weight:600;font-size:15px}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .home{display:inline-block;margin-top:16px;color:var(--muted);font-size:14px;text-decoration:underline}
  /* Fase 1 — View Transitions + Dark mode */
  @view-transition{navigation:auto;}
  @media(prefers-reduced-motion:no-preference){
    ::view-transition-old(root){animation:vt-out .26s ease both;}
    ::view-transition-new(root){animation:vt-in .34s ease both;}
    @keyframes vt-out{to{opacity:0;transform:translateY(-6px);}}
    @keyframes vt-in{from{opacity:0;transform:translateY(10px);}}
  }
  html{color-scheme:light dark;}
  @media(prefers-color-scheme:dark){:root{--paper:#141210;--ink:#EDE8DC;--muted:#9A9182;--line:rgba(237,232,220,.16);--forest:#0F2C20;--on-forest:#E9E4D6;}}
  :root[data-theme="dark"]{--paper:#141210;--ink:#EDE8DC;--muted:#9A9182;--line:rgba(237,232,220,.16);--forest:#0F2C20;--on-forest:#E9E4D6;}
  :focus-visible{outline:2px solid var(--forest);outline-offset:3px;border-radius:3px;}
</style>
</head>
<body>
<script>(function(){try{var s=localStorage.getItem('srm-theme');if(s)document.documentElement.setAttribute('data-theme',s);}catch(e){}})();</script>
  <div class="card">
    <div class="x"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></div>
    <h1>No se pudo procesar el pago</h1>
    <p>La operación fue rechazada o cancelada. No se te cobró nada. Podés intentar de nuevo o escribirme y lo resolvemos juntos.</p>
    <div class="row">
      <a class="btn" href="/app/">Intentar de nuevo</a>
      <a class="btn ghost" id="wa" href="#" target="_blank" rel="noopener">Escribime →</a>
    </div>
    <br><a class="home" href="/">← Volver al inicio</a>
  </div>
<script>
  var PHONE='5493536561265';
  document.getElementById('wa').href='https://wa.me/'+PHONE+'?text='+encodeURIComponent('Hola Santiago, tuve un problema al pagar por la web. ¿Me ayudás?');
</script>
<script src="/shared/stars.js" defer></script>
</body>
</html>
